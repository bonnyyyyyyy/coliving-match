<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KSE colivings — анкета на поселення</title>
<meta name="description" content="Анкета на поселення в колівінги KSE">
<meta name="theme-color" content="#2C44EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root{
    --cobalt:#2C44EE;
    --cobalt-deep:#1B2FC4;
    --cobalt-soft:#5568FF;
    --cream:#F7EDD7;
    --cream-2:#FFF6E6;
    --ink:#141A3C;
    --ink-soft:#5A6180;
    --line:#E6E8F2;
    --field:#F2F3F9;
    --danger:#D62D3E;
    --radius-card:30px;
    --radius-opt:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cobalt);
    color:#fff;
    font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-weight:600;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ---------- background decorations ---------- */
  .decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .decor svg{position:absolute;display:block}
  .star{fill:var(--cream)}
  .blob{fill:var(--cobalt-soft)}
  .blob.cream{fill:var(--cream);opacity:.22}
  .d1{top:-40px;right:-30px;width:190px;opacity:.95}
  .d2{top:34vh;left:-56px;width:150px;opacity:.5}
  .d3{bottom:8vh;right:-40px;width:210px;opacity:.35}
  .d4{top:12vh;left:-30px;width:180px;opacity:.45}
  .d5{bottom:-60px;left:-50px;width:260px;opacity:.5}
  .d6{top:62vh;right:6vw;width:70px;opacity:.35}
  @media (min-width:760px){
    .d1{width:250px}.d2{width:200px;left:-40px}.d3{width:300px}.d6{width:100px}
  }

  /* ---------- shell ---------- */
  .shell{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:18px 16px 40px}
  @media (min-width:760px){ .shell{padding:28px 24px 64px} }
  @media (min-width:760px){ .intro p{max-width:46ch;font-size:18px} }

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand-mark{font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:.9;font-weight:700;letter-spacing:.5px}
  .brand-sub{font-size:15px;font-weight:700;letter-spacing:.2px;opacity:.95;padding-top:6px}
  .brand-rule{width:2px;height:34px;background:rgba(255,255,255,.5);border-radius:2px}

  .intro h1{
    font-size:clamp(34px,10vw,54px);
    line-height:1.02;
    font-weight:900;
    letter-spacing:-.5px;
    margin:0 0 14px;
  }
  .intro p{font-size:16px;line-height:1.5;margin:0 0 22px;max-width:34ch;opacity:.95}

  /* ---------- progress ---------- */
  .progress{
    position:sticky;top:0;z-index:5;
    margin:0 -16px 18px;padding:12px 16px 14px;
    background:linear-gradient(180deg,var(--cobalt) 72%,rgba(44,68,238,0));
  }
  @media (min-width:760px){ .progress{margin:0 -24px 20px;padding:14px 24px 18px} }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .progress-step{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
  .progress-name{font-size:15px;font-weight:800;text-align:right}
  .bars{display:flex;gap:6px}
  .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--cream);border-radius:99px;transition:width .35s ease}
  .bar.done span{width:100%}
  .bar.now span{width:100%}

  /* ---------- cards ---------- */
  .q{
    background:#fff;color:var(--ink);
    border-radius:var(--radius-card);
    padding:24px 20px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(11,22,90,.16);
  }
  @media (min-width:760px){ .q{padding:30px 28px} }
  .q.hidden{display:none}
  .q-num{
    display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;
    color:var(--cobalt);background:#EDEFFF;border-radius:99px;padding:5px 11px;margin-bottom:12px;
  }
  .q-text{font-size:19px;line-height:1.32;font-weight:800;margin:0 0 6px}
  @media (min-width:760px){ .q-text{font-size:21px} }
  .q-hint{font-size:14px;font-weight:600;color:var(--ink-soft);margin:8px 0 0}
  .q-opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}

  .opt{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--field);border:2px solid transparent;border-radius:var(--radius-opt);
    padding:14px 16px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .08s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.99)}
  .opt input{position:absolute;opacity:0;width:0;height:0}
  .mark{
    flex:none;width:22px;height:22px;margin-top:1px;
    border:2px solid #C3C7DC;background:#fff;
    display:grid;place-items:center;transition:all .15s ease;
  }
  .opt.radio .mark{border-radius:50%}
  .opt.check .mark{border-radius:7px}
  .mark::after{content:'';opacity:0;transition:opacity .12s ease}
  .opt.radio .mark::after{width:10px;height:10px;border-radius:50%;background:#fff}
  .opt.check .mark::after{
    width:6px;height:11px;margin-top:-3px;
    border:solid #fff;border-width:0 3px 3px 0;transform:rotate(43deg);
  }
  .opt-txt{font-size:16px;line-height:1.35;font-weight:700}
  .opt.on{background:#E9ECFF;border-color:var(--cobalt)}
  .opt.on .mark{background:var(--cobalt);border-color:var(--cobalt)}
  .opt.on .mark::after{opacity:1}
  .opt.locked{opacity:.42}
  @media (hover:hover){ .opt:hover{background:#E9ECFF} }

  .counter{font-size:13px;font-weight:800;color:var(--ink-soft);margin-top:12px}
  .counter.full{color:var(--cobalt)}

  input[type=text],input[type=email]{
    width:100%;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
    background:var(--field);border:2px solid transparent;border-radius:16px;
    padding:14px 16px;margin-top:14px;outline:none;
    transition:border-color .15s ease,background .15s ease;
  }
  input::placeholder{color:#A2A7C2;font-weight:600}
  input:focus{border-color:var(--cobalt);background:#fff}
  .names{display:flex;flex-direction:column;gap:8px}
  .names input{margin-top:0}
  .names input:first-child{margin-top:14px}

  .err{
    display:none;margin-top:12px;font-size:14px;font-weight:800;color:var(--danger);
  }
  .q.invalid .err{display:block}
  .q.invalid{box-shadow:0 0 0 3px var(--danger),0 10px 30px rgba(11,22,90,.16)}
  .shake{animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}
  }

  /* ---------- nav ---------- */
  .nav{display:flex;gap:10px;align-items:center;margin-top:22px}
  .btn{
    font-family:inherit;font-size:17px;font-weight:900;
    border:none;border-radius:99px;padding:17px 26px;cursor:pointer;
    transition:transform .08s ease,box-shadow .15s ease,opacity .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{flex:1;background:var(--cream);color:var(--cobalt-deep);box-shadow:0 8px 22px rgba(10,20,80,.22)}
  .btn-ghost{background:rgba(255,255,255,.16);color:#fff;padding:17px 20px}
  .btn[disabled]{opacity:.6;cursor:default}
  .nav-note{font-size:13px;font-weight:700;opacity:.8;margin-top:12px;text-align:center}

  /* ---------- thanks ---------- */
  #thanks{display:none;text-align:center;padding:12vh 6px 40px}
  #thanks.on{display:block}
  #thanks .star-big{width:110px;margin:0 auto 26px;display:block;fill:var(--cream)}
  #thanks h2{font-size:clamp(32px,9vw,46px);line-height:1.05;font-weight:900;margin:0 0 14px}
  #thanks p{font-size:17px;line-height:1.5;font-weight:600;opacity:.95;margin:0 auto;max-width:30ch}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="decor" aria-hidden="true">

  <svg class="d2" viewBox="0 0 100 100"><path class="star" d="M50 0 58 34 86 14 70 44 100 50 70 56 86 86 58 66 50 100 42 66 14 86 30 56 0 50 30 44 14 14 42 34Z"/></svg>
  <svg class="d3" viewBox="0 0 100 100"><path class="star" d="M50 0 58 34 86 14 70 44 100 50 70 56 86 86 58 66 50 100 42 66 14 86 30 56 0 50 30 44 14 14 42 34Z"/></svg>
  <svg class="d6" viewBox="0 0 100 100"><path class="star" d="M50 0 58 34 86 14 70 44 100 50 70 56 86 86 58 66 50 100 42 66 14 86 30 56 0 50 30 44 14 14 42 34Z"/></svg>
  <svg class="d4" viewBox="0 0 100 100"><path class="blob" d="M54 3c19-6 39 9 43 29 4 20-8 39-24 50-16 11-36 15-48 4C13 75 6 55 11 36 16 17 35 9 54 3Z"/></svg>
  <svg class="d5" viewBox="0 0 100 100"><path class="blob cream" d="M46 5c21-8 44 5 50 26 6 21-6 44-24 55-18 11-42 10-53-4C8 68 6 44 14 28 22 12 25 13 46 5Z"/></svg>
</div>

<div class="shell">
  <div class="brand">
    <div class="brand-mark">KSE</div>
    <div class="brand-rule"></div>
    <div class="brand-sub">colivings</div>
  </div>

  <main id="app">
    <div class="intro" id="intro">
      <h1>Анкета на поселення</h1>
      <p>5 блоків, хвилин на п'ять. Відповідай як є — від цього залежить, з ким ти житимеш ✨</p>
    </div>

    <div class="progress" id="progress" hidden>
      <div class="progress-top">
        <div class="progress-step" id="progressStep">Блок 1 з 5</div>
        <div class="progress-name" id="progressName">Про тебе</div>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <form id="form" autocomplete="on" novalidate>
      <div id="steps"></div>
    </form>

    <div class="nav" id="nav">
      <button type="button" class="btn btn-ghost" id="btnBack" hidden>← Назад</button>
      <button type="button" class="btn btn-primary" id="btnNext">Далі →</button>
    </div>
    <div class="nav-note" id="navNote"></div>
  </main>

  <section id="thanks">
    <svg class="star-big" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 58 34 86 14 70 44 100 50 70 56 86 86 58 66 50 100 42 66 14 86 30 56 0 50 30 44 14 14 42 34Z"/></svg>
    <h2>Дякуємо, відповіді збережено</h2>
    <p>Все записали. Далі за нас працює алгоритм — про результати напишемо на пошту 💌</p>
  </section>
</div>

const $  = s => document.querySelector(s);
const el = (t,c,txt) => { const n=document.createElement(t); if(c) n.className=c; if(txt!=null) n.textContent=txt; return n; };

const BLOCKS = SCHEMA.blocks;
const GATE   = SCHEMA.logic.gate;
const answers = {};
let step = 0;
let sending = false;

const gated = () => answers[GATE.question] === GATE.hide_rest_when;
const isVisible = q => !gated() || q.id === GATE.question;
const qsOf = b => SCHEMA.questions.filter(q => q.block === b.id);
const isLastStep = () => gated() || step === BLOCKS.length - 1;

/* ---------- рендер ---------- */
function buildBars(){
  const bars = $('#bars');
  bars.innerHTML = '';
  BLOCKS.forEach(() => { const b = el('div','bar'); b.appendChild(el('span')); bars.appendChild(b); });
}

function renderStep(){
  const block = BLOCKS[step];
  const wrap = $('#steps');
  wrap.innerHTML = '';
  wrap.className = 'fade';

  $('#intro').hidden = step !== 0;
  $('#progress').hidden = false;
  $('#progressStep').textContent = 'Блок ' + (step + 1) + ' з ' + BLOCKS.length;
  $('#progressName').textContent = block.short;
  [...$('#bars').children].forEach((b,i) => {
    b.className = 'bar' + (i < step ? ' done' : i === step ? ' now' : '');
  });

  qsOf(block).forEach(q => wrap.appendChild(renderQuestion(q)));
  applyGate();
  updateNav();
  window.scrollTo({ top: 0, behavior: step === 0 ? 'auto' : 'smooth' });
}

function renderQuestion(q){
  const card = el('div','q');
  card.dataset.q = q.id;
  card.appendChild(el('div','q-num', String(q.number)));
  card.appendChild(el('h2','q-text', q.text));
  if (!q.required) card.appendChild(el('p','q-hint','Необов’язково'));

  if (q.type === 'single')      card.appendChild(renderSingle(q));
  else if (q.type === 'multi')  card.appendChild(renderMulti(q, card));
  else if (q.id === 'q05')      card.appendChild(renderNames(q));
  else                          card.appendChild(renderTextInput(q));

  card.appendChild(el('div','err',''));
  return card;
}

function clearError(card){ card.classList.remove('invalid'); }

function renderSingle(q){
  const box = el('div','q-opts');
  q.options.forEach(o => {
    const lab = el('label','opt radio');
    const inp = el('input'); inp.type='radio'; inp.name=q.id; inp.value=o.value;
    inp.checked = answers[q.id] === o.value;
    if (inp.checked) lab.classList.add('on');
    lab.appendChild(inp);
    lab.appendChild(el('span','mark'));
    lab.appendChild(el('span','opt-txt', o.label));
    inp.addEventListener('change', () => {
      answers[q.id] = o.value;
      [...box.children].forEach(c => c.classList.toggle('on', c.contains(inp)));
      clearError(lab.closest('.q'));
      if (q.id === GATE.question) applyGate();
    });
    box.appendChild(lab);
  });
  return box;
}

function renderMulti(q, card){
  const box = el('div','q-opts');
  const max = q.max_select;
  const picked = () => answers[q.id] || (answers[q.id] = []);
  const counter = el('div','counter');

  const sync = () => {
    const n = picked().length;
    if (max){
      counter.textContent = 'Обрано ' + n + ' з ' + max;
      counter.classList.toggle('full', n >= max);
      [...box.children].forEach(lab => {
        const on = lab.classList.contains('on');
        lab.classList.toggle('locked', !on && n >= max);
      });
    } else {
      counter.textContent = n ? 'Обрано: ' + n : 'Обирай скільки хочеш';
    }
  };

  q.options.forEach(o => {
    const lab = el('label','opt check');
    const inp = el('input'); inp.type='checkbox'; inp.value=o.value;
    inp.checked = picked().includes(o.value);
    if (inp.checked) lab.classList.add('on');
    lab.appendChild(inp);
    lab.appendChild(el('span','mark'));
    lab.appendChild(el('span','opt-txt', o.label));
    inp.addEventListener('change', () => {
      const arr = picked();
      if (inp.checked){
        if (max && arr.length >= max){
          inp.checked = false;
          counter.textContent = 'Максимум ' + max + ' — зніми щось, щоб обрати інше';
          counter.classList.add('full');
          counter.classList.remove('shake'); void counter.offsetWidth; counter.classList.add('shake');
          return;
        }
        arr.push(o.value);
      } else {
        answers[q.id] = arr.filter(v => v !== o.value);
      }
      lab.classList.toggle('on', inp.checked);
      clearError(card);
      sync();
    });
    box.appendChild(lab);
  });

  const holder = el('div');
  holder.appendChild(box);
  holder.appendChild(counter);
  sync();
  return holder;
}

function renderTextInput(q){
  const inp = el('input');
  inp.type = q.type === 'email' ? 'email' : 'text';
  inp.id = q.id;
  inp.value = answers[q.id] || '';
  inp.placeholder = q.type === 'email' ? 'name@example.com' : 'Твоя відповідь';
  if (q.id === 'q02'){ inp.autocomplete = 'name'; inp.placeholder = 'Наприклад, Олена Ковальчук'; }
  if (q.type === 'email'){ inp.autocomplete='email'; inp.inputMode='email'; }
  if (q.id === 'q04') inp.placeholder = 'Наприклад, економіка';
  inp.addEventListener('input', () => {
    answers[q.id] = inp.value.trim();
    clearError(inp.closest('.q'));
  });
  return inp;
}

function renderNames(q){
  const box = el('div','names');
  const stored = answers[q.id] || [];
  for (let i = 0; i < q.max_items; i++){
    const inp = el('input');
    inp.type = 'text';
    inp.placeholder = 'Ім’я та прізвище ' + (i + 1);
    inp.value = stored[i] || '';
    inp.addEventListener('input', () => {
      const vals = [...box.querySelectorAll('input')].map(x => x.value.trim());
      answers[q.id] = vals;
    });
    box.appendChild(inp);
  }
  return box;
}

/* ---------- гейт «Ні, передумав/передумала» ---------- */
function applyGate(){
  document.querySelectorAll('#steps .q').forEach(card => {
    const q = SCHEMA.questions.find(x => x.id === card.dataset.q);
    const show = isVisible(q);
    card.classList.toggle('hidden', !show);
    if (!show) clearError(card);
  });
  updateNav();
}

/* ---------- навігація ---------- */
function updateNav(){
  $('#btnBack').hidden = step === 0;
  $('#btnNext').textContent = isLastStep() ? 'Надіслати' : 'Далі →';
  $('#navNote').textContent = gated()
    ? 'Шкода! Тисни «Надіслати» — і ми знімемо тебе зі списку.'
    : (isLastStep() ? 'Останній крок 🎉' : '');
}

function validateStep(){
  let firstBad = null;
  qsOf(BLOCKS[step]).forEach(q => {
    if (!isVisible(q)) return;
    const card = document.querySelector('.q[data-q="' + q.id + '"]');
    if (!card) return;
    const fail = msg => {
      card.classList.add('invalid');
      card.querySelector('.err').textContent = msg;
      if (!firstBad) firstBad = card;
    };
    clearError(card);

    if (q.type === 'single'){
      if (q.required && !answers[q.id]) fail('Тут треба обрати варіант 👀');
    } else if (q.type === 'multi'){
      const n = (answers[q.id] || []).length;
      if (q.required && n < (q.min_select || 1)) fail('Обери хоча б один варіант 👀');
      else if (q.max_select && n > q.max_select) fail('Максимум ' + q.max_select + ' варіанти');
    } else if (q.type === 'email'){
      const v = (answers[q.id] || '').trim();
      if (!v){ if (q.required) fail('Без пошти не знайдемо тебе 👀'); }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) fail('Схоже на друк — перевір адресу');
    } else if (q.id === 'q05'){
      /* необов’язкове, без валідації */
    } else {
      if (q.required && !(answers[q.id] || '').trim()) fail('Тут треба відповісти 👀');
    }
  });

  if (firstBad){
    firstBad.classList.remove('shake'); void firstBad.offsetWidth; firstBad.classList.add('shake');
    firstBad.scrollIntoView({ behavior:'smooth', block:'center' });
    return false;
  }
  return true;
}

function buildPayload(){
  const out = {};
  SCHEMA.questions.forEach(q => {
    if (!isVisible(q)) return;
    if (q.type === 'multi')      out[q.id] = answers[q.id] || [];
    else if (q.id === 'q05')     out[q.id] = (answers[q.id] || []).map(s => s.trim()).filter(Boolean).slice(0, q.max_items);
    else                         out[q.id] = answers[q.id] || '';
  });
  out._schema_version = SCHEMA.meta.version;
  out._submitted_at = new Date().toISOString();
  return out;
}

async function submit(){
  if (sending) return;
  sending = true;
  const btn = $('#btnNext');
  btn.disabled = true;
  btn.textContent = 'Надсилаємо…';
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(buildPayload())
    });
    showThanks();
  } catch (e) {
    sending = false;
    btn.disabled = false;
    btn.textContent = 'Спробувати ще раз';
    $('#navNote').textContent = 'Не вийшло надіслати — перевір інтернет і тисни ще раз.';
  }
}

function showThanks(){
  $('#app').style.display = 'none';
  const t = $('#thanks');
  t.classList.add('on','fade');
  window.scrollTo({ top: 0 });
}

$('#btnNext').addEventListener('click', () => {
  if (!validateStep()) return;
  if (isLastStep()) submit();
  else { step++; renderStep(); }
});
$('#btnBack').addEventListener('click', () => {
  if (step > 0){ step--; renderStep(); }
});

buildBars();
renderStep();
</script>
